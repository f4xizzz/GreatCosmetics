plugins {
	id 'com.gradleup.shadow'
}

architectury {
	platformSetupLoomIde()
	neoForge()
}

loom {
	accessWidenerPath = project(':common').loom.accessWidenerPath
}

configurations {
	common {
		canBeResolved = true
		canBeConsumed = false
	}
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentNeoForge.extendsFrom common

	shadowBundle {
		canBeResolved = true
		canBeConsumed = false
	}
}

dependencies {
	neoForge "net.neoforged:neoforge:${neoforge_version}"

	modImplementation "dev.architectury:architectury-neoforge:${architectury_api_version}"
	modImplementation "com.cobblemon:neoforge:${cobblemon_version}"
	modImplementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:${geckolib_version}"
	modImplementation "thedarkcolour:kotlinforforge-neoforge:${kotlin_for_forge_version}"

	common(project(path: ':common', configuration: 'namedElements')) { transitive false }
	shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
	inputs.property 'version', project.version
	filesMatching('META-INF/neoforge.mods.toml') {
		expand version: project.version
	}
}

shadowJar {
	configurations = [project.configurations.shadowBundle]
	archiveClassifier = 'dev-shadow'
}

remapJar {
	input.set shadowJar.archiveFile
	dependsOn shadowJar
	archiveClassifier = null
}

jar {
	archiveClassifier = 'dev'
}
