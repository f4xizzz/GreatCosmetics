plugins {
	id 'com.gradleup.shadow'
}

architectury {
	platformSetupLoomIde()
	neoForge()
}

loom {
	accessWidenerPath = project(':common').loom.accessWidenerPath
}

configurations {
	common {
		canBeResolved = true
		canBeConsumed = false
	}
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentNeoForge.extendsFrom common

	shadowBundle {
		canBeResolved = true
		canBeConsumed = false
	}
}

dependencies {
	neoForge "net.neoforged:neoforge:${neoforge_version}"

	modImplementation "dev.architectury:architectury-neoforge:${architectury_api_version}"
	modImplementation "com.cobblemon:neoforge:${cobblemon_version}"
	modImplementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:${geckolib_version}"
	modImplementation "thedarkcolour:kotlinforforge-neoforge:${kotlin_for_forge_version}"

	// LuckPerms — soft dep (checado em runtime); só precisa compilar contra a API.
	compileOnly "net.luckperms:api:5.5"

	// Adventure: só as libs PURAS (mesmo conjunto do fabric/). include() = jarJar no NeoForge.
	implementation include("net.kyori:adventure-api:4.17.0")
	implementation include("net.kyori:adventure-text-minimessage:4.17.0")
	implementation include("net.kyori:adventure-text-serializer-gson:4.17.0")
	implementation include("net.kyori:adventure-text-serializer-legacy:4.17.0")
	implementation include("net.kyori:examination-api:1.3.0")
	implementation include("net.kyori:examination-string:1.3.0")
	implementation include("net.kyori:adventure-key:4.17.0")
	implementation include("net.kyori:option:1.0.0")

	// Drivers de banco (JiJ / jarJar).
	implementation include("org.xerial:sqlite-jdbc:3.45.1.0")
	implementation include("com.mysql:mysql-connector-j:8.3.0")

	common(project(path: ':common', configuration: 'namedElements')) { transitive false }
	shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
	inputs.property 'version', project.version
	filesMatching('META-INF/neoforge.mods.toml') {
		expand version: project.version
	}
}

shadowJar {
	configurations = [project.configurations.shadowBundle]
	archiveClassifier = 'dev-shadow'
}

remapJar {
	input.set shadowJar.archiveFile
	dependsOn shadowJar
	archiveClassifier = null
}

jar {
	archiveClassifier = 'dev'
}

// Ofuscação (ProGuard) + manifesto de integridade assinado — gera o -release.jar distribuível.
apply from: "$rootDir/proguard.gradle"
