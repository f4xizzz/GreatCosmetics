plugins {
	id 'dev.architectury.loom' version "${architectury_loom_version}" apply false
	id 'architectury-plugin' version "${architectury_plugin_version}"
	id 'com.gradleup.shadow' version "${shadow_version}" apply false
}

architectury {
	minecraft = minecraft_version
}

allprojects {
	group = maven_group
	version = mod_version
}

subprojects {
	apply plugin: 'dev.architectury.loom'
	apply plugin: 'architectury-plugin'
	apply plugin: 'maven-publish'

	base {
		archivesName = "${archives_base_name}-${project.name}"
	}

	repositories {
		mavenCentral()
		maven { name = 'Fabric';        url = 'https://maven.fabricmc.net/' }
		maven { name = 'Architectury';  url = 'https://maven.architectury.dev/' }
		maven { name = 'NeoForged';     url = 'https://maven.neoforged.net/releases/' }
		maven { name = 'Cobblemon';     url = 'https://maven.impactdev.net/repository/development/' }
		maven { name = 'GeckoLib';      url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
		maven { name = 'KotlinForForge'; url = 'https://thedarkcolour.github.io/KotlinForForge/' }
		maven { name = 'ParchmentMC';   url = 'https://maven.parchmentmc.org' }
		maven { name = 'Modrinth';      url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
		maven { name = 'LuckPerms';     url = 'https://repo.lucko.me/' }
		maven { name = 'Sonatype';      url = 'https://oss.sonatype.org/content/repositories/snapshots' }
		flatDir { dirs "${rootProject.projectDir}/libs" }
	}

	dependencies {
		minecraft "com.mojang:minecraft:${minecraft_version}"
		mappings loom.officialMojangMappings()
	}

	tasks.withType(JavaCompile).configureEach {
		options.encoding = 'UTF-8'
		options.release = 21
	}

	java {
		sourceCompatibility = JavaVersion.VERSION_21
		targetCompatibility = JavaVersion.VERSION_21
	}

	// Segurança: o GreatCosmetics é pago — nunca publicar um sources jar (ver build.gradle.legacy).
	tasks.withType(GenerateModuleMetadata).configureEach { enabled = false }

	// EULA proprietário empacotado em cada jar (ver LICENSE / plano anti-pirataria).
	tasks.withType(Jar).configureEach {
		from(rootProject.file('LICENSE')) {
			rename { "${it}_${archives_base_name}" }
		}
	}
}
