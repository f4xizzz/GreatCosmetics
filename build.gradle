plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id 'org.jetbrains.kotlin.jvm' version '2.4.0'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	gradlePluginPortal()
	flatDir {
		dirs 'libs'
	}
	maven { url "https://jitpack.io" }
	maven { url "https://cursemaven.com" }
	maven { url "https://maven.fabricmc.net/" }
	maven { url "https://maven.architectury.dev/" }
	maven { url "https://repo.maven.apache.org/maven2/" }
	maven { url "https://repo.spongepowered.org/maven/" }
	maven { url "https://repo.essentialsx.net/releases/" }
	maven { url "https://maven.neoforged.net/releases/" }
	maven { url "https://files.minecraftforge.net/maven/" }
	maven { url "https://thedarkcolour.github.io/KotlinForForge/" }
	maven { url "https://papermc.io/repository/maven-public/" }
	maven { url "https://maven.impactdev.net/repository/development/" }
	maven { url "https://hub.spigotmc.org/nexus/content/repositories/snapshots/" }
	maven { url "https://repo.extendedclip.com/content/repositories/placeholderapi/" }
	maven { url "https://maven.nucleoid.xyz/"; name = "Nucleoid" }
	maven { url "https://oss.sonatype.org/content/repositories/snapshots"; name = "Sonatype Snapshots" }
	maven { url "https://s01.oss.sonatype.org/content/repositories/snapshots"; name = "Sonatype 01 Snapshots" }

		maven {
			name = "Modrinth"
			url = "https://api.modrinth.com/maven"
			content {
				includeGroup "maven.modrinth"
		}
	}

	maven {
		name = "WispForest"
		url = "https://maven.wispforest.io/"
	}
}

loom {
	accessWidenerPath = file('src/main/resources/greatcosmetics.accesswidener')
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:1.21.1+build.2:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// GreatCosmetics ainda depende do Cobblemon: a aba Party do wardrobe (ver time/skins do
	// próprio Pokémon) e os bônus de Lure ficam aqui porque reusam o mesmo pipeline de
	// renderização/rede do wardrobe — não dá pra separar sem duplicar essa engine inteira. O
	// resto da integração com EasyNPC (diálogo/animação/hitbox de NPC) virou o mod separado
	// EasyNPCobblemonIntegration, sem depender deste jar.
	modImplementation "com.cobblemon:fabric:1.7.3+1.21.1"
	modImplementation "dev.architectury:architectury-fabric:13.0.8"

	modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

	modImplementation name: 'geckolib-fabric-1.21.1-4.8.4'
	include name: 'geckolib-fabric-1.21.1-4.8.4'

	compileOnly "net.luckperms:api:5.5"

	modImplementation include("net.kyori:adventure-text-minimessage:4.17.0")
	modImplementation include("net.kyori:adventure-platform-fabric:5.14.0")

	implementation "net.impactdev.impactor.api:economy:5.3.5"

// 1. GooeyLibs
	modImplementation name: 'GooeyLibs-Fabric-3.1.1-1.21.x'
	include name: 'GooeyLibs-Fabric-3.1.1-1.21.x'

	modImplementation name: 'Axiom-5.4.2-for-MC1.21.1'

	// 2. API Repack do GooeyLibs
	modImplementation name: 'api-repack-3.1.1-1.21.x'
	include name: 'api-repack-3.1.1-1.21.x'

	// --- DRIVER DO SQLITE (Banco local de testes) ---
	implementation 'org.xerial:sqlite-jdbc:3.45.1.0'
	include 'org.xerial:sqlite-jdbc:3.45.1.0'

	// --- DRIVER DO MYSQL (Banco oficial do servidor) ---
	implementation 'com.mysql:mysql-connector-j:8.3.0'
	include 'com.mysql:mysql-connector-j:8.3.0'

	// --- MEGA SHOWNDOWN (só pro ambiente de dev, ver PartyPage) ---
	modImplementation "maven.modrinth:SszvX85I:ch7DfnXP"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
