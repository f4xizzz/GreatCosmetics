plugins {
	id 'com.gradleup.shadow'
}

architectury {
	platformSetupLoomIde()
	fabric()
}

loom {
	accessWidenerPath = project(':common').loom.accessWidenerPath
}

configurations {
	common {
		canBeResolved = true
		canBeConsumed = false
	}
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentFabric.extendsFrom common

	shadowBundle {
		canBeResolved = true
		canBeConsumed = false
	}
}

repositories {
	maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org' }
	maven { name = 'Ladysnake / Cardinal'; url = 'https://maven.ladysnake.org/releases' }
	maven { name = 'TerraformersMC'; url = 'https://maven.terraformersmc.com/' }
	maven { name = 'JitPack'; url = 'https://jitpack.io' }
}

dependencies {
	modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
	modImplementation "net.fabricmc:fabric-language-kotlin:${fabric_kotlin_version}"

	modImplementation "dev.architectury:architectury-fabric:${architectury_api_version}"
	modImplementation "com.cobblemon:fabric:${cobblemon_version}"
	modImplementation "software.bernie.geckolib:geckolib-fabric-1.21.1:${geckolib_version}"

	// LuckPerms — soft dep (checado em runtime); só precisa compilar contra a API.
	compileOnly "net.luckperms:api:5.5"

	// Adventure: só as libs PURAS (o mod converte pra Component nativo via GsonComponentSerializer).
	implementation include("net.kyori:adventure-api:4.17.0")
	implementation include("net.kyori:adventure-text-minimessage:4.17.0")
	implementation include("net.kyori:adventure-text-serializer-gson:4.17.0")
	implementation include("net.kyori:adventure-text-serializer-legacy:4.17.0")
	implementation include("net.kyori:examination-api:1.3.0")
	implementation include("net.kyori:examination-string:1.3.0")
	implementation include("net.kyori:adventure-key:4.17.0")
	implementation include("net.kyori:option:1.0.0")

	// Drivers de banco (JiJ).
	implementation include("org.xerial:sqlite-jdbc:3.45.1.0")
	implementation include("com.mysql:mysql-connector-j:8.3.0")

	common(project(path: ':common', configuration: 'namedElements')) { transitive false }
	shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand version: project.version
	}
}

shadowJar {
	configurations = [project.configurations.shadowBundle]
	archiveClassifier = 'dev-shadow'
}

remapJar {
	input.set shadowJar.archiveFile
	dependsOn shadowJar
	archiveClassifier = null
}

jar {
	archiveClassifier = 'dev'
}

// Ofuscação (ProGuard) + manifesto de integridade assinado — gera o -release.jar distribuível.
apply from: "$rootDir/proguard.gradle"
